<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>인천 미세먼지 지도</title>
  <script src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=0q0a3jnlqu&submodules=visualization"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, " Malgun Gothic", sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      background: #ffffff;
      border-left: 1px solid #e5e7eb;
      padding: 20px;
      overflow: hidden;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }

    .desc {
      margin: 0 0 16px;
      font-size: 14px;
      line-height: 1.5;
      color: #4b5563;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .card:hover {
      background: #eef2ff;
    }

    .meta {
      font-size: 13px;
      color: #6b7280;
      margin-top: 6px;
      line-height: 1.5;
    }

    .value {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 6px 10px;
      background: #e0f2fe;
      border-radius: 999px;
      font-weight: 700;
      font-size: 14px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 14px 0 18px;
    }

    button {
      border: none;
      background: #16a34a;
      color: white;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      min-width: 0;
      flex: 1 1 auto;
    }

    button.secondary {
      background: #2563eb;
    }

    .metric-toggle {
      background: #e5e7eb;
      color: #374151;
    }

    .metric-toggle.active {
      background: #16a34a;
      color: white;
    }

    .legend {
      margin-bottom: 10px;
    }

    .legend-title {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 6px;
    }

    .legend-row {
      display: flex;
      gap: 8px;
    }

    .legend-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #4b5563;
      line-height: 1.3;
    }

    .legend-swatch {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      flex-shrink: 0;
    }

    .metric-note {
      margin: 0 0 12px;
      font-size: 12px;
      color: #b45309;
      min-height: 1em;
    }

    .add-form {
      min-width: 240px;
      max-width: 260px;
      font-size: 13px;
      padding: 2px 2px 4px;
    }

    .add-form-header {
      font-size: 15px;
      font-weight: 700;
      color: #111827;
    }

    .add-form-coords {
      font-size: 11px;
      color: #9ca3af;
      margin: 2px 0 10px;
    }

    .add-form label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      margin: 10px 0 4px;
    }

    .add-form input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .add-form input:focus {
      border-color: #16a34a;
    }

    .add-form-metric {
      display: flex;
      gap: 6px;
    }

    .add-metric-btn {
      flex: 1;
      padding: 8px 4px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      background: #f9fafb;
      color: #6b7280;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
      transition: all 0.15s ease;
      min-width: 0;
    }

    .add-metric-btn small {
      font-size: 10px;
      opacity: 0.8;
    }

    .add-metric-btn.active {
      background: #16a34a;
      border-color: #16a34a;
      color: white;
    }

    .add-form-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .add-form-submit {
      flex: 2;
      padding: 9px 8px;
      font-size: 13px;
      font-weight: 600;
      background: #16a34a;
      color: white;
      min-width: 0;
    }

    .add-form-cancel {
      flex: 1;
      padding: 9px 8px;
      font-size: 13px;
      background: #f3f4f6;
      color: #6b7280;
      min-width: 0;
    }

    .add-form-status {
      margin-top: 8px;
      font-size: 11.5px;
      color: #6b7280;
      min-height: 1.2em;
    }

    .date-filter {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      font-size: 13px;
      color: #374151;
      background: #f9fafb;
    }

    .status {
      margin-bottom: 16px;
      font-size: 13px;
      color: #4b5563;
    }

    .small {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.45;
    }

    .empty {
      color: #9ca3af;
      font-size: 14px;
      padding: 10px 0;
    }

    .infobox {
      min-width: 220px;
      max-width: 280px;
      padding: 4px;
      font-size: 13px;
      line-height: 1.55;
    }

    .infobox strong {
      font-size: 15px;
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }

      #map {
        height: 60vh;
      }

      .panel {
        border-left: 0;
        border-top: 1px solid #e5e7eb;
      }

      #list {
        display: none;
      }

      .toolbar button {
        flex: 1 1 48%;
      }
    }

    @media (max-width: 640px) {
      #map {
        height: 55vh;
      }

      .panel {
        padding: 16px 14px;
      }

      h1 {
        font-size: 20px;
      }

      .desc {
        font-size: 13px;
      }

      .toolbar {
        gap: 6px;
      }

      .toolbar button {
        flex: 1 1 100%;
      }

      .card {
        padding: 12px;
      }

      .value {
        font-size: 13px;
      }
    }

    #list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 6px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div id="map"></div>
    <aside class="panel">
      <h1>인천 공동탐구 지도</h1>
      <p class="desc">
        구글 시트에 입력된 위도·경도·미세먼지 데이터와 공공데이터포털 실시간 측정소 데이터를 함께 네이버 지도에 표시합니다. 지도를 클릭하면 그 위치에 새 측정값을 바로 추가할 수 있습니다.
      </p>

      <div class="toolbar">
        <button onclick="refreshAll()">데이터 새로고침</button>
        <button class="secondary" onclick="fitAllMarkers()">전체 보기</button>
      </div>

      <div class="toolbar">
        <button class="metric-toggle active" data-metric="pm10" onclick="setMetric('pm10')">미세먼지 (PM10)</button>
        <button class="metric-toggle" data-metric="pm25" onclick="setMetric('pm25')">초미세먼지 (PM2.5)</button>
      </div>

      <select id="dateFilter" class="date-filter" onchange="onDateFilterChange(this.value)">
        <option value="all">전체 날짜</option>
      </select>

      <div id="legend" class="legend"></div>
      <p id="metricNote" class="metric-note"></p>

      <div id="status" class="status">데이터를 불러오는 중...</div>
      <div id="officialStatus" class="status"></div>
      <div id="list"></div>
    </aside>
  </div>

  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/1TwzHZnKh4WYYGH8sM5cA1EWT6y5WZ6ZA7Vn5x9v2yqg/export?format=csv&gid=0';

    // 공공데이터포털 - 한국환경공단 에어코리아 대기오염정보
    const airKoreaServiceKey = '80ac8e46d3319fadc8bca056e2228f5f76771a34327295b9b8cb5a61e05c28b9';
    const airKoreaBase = 'https://apis.data.go.kr/B552584/ArpltnInforInqireSvc';
    const msrstnBase = 'https://apis.data.go.kr/B552584/MsrstnInfoInqireSvc';
    const targetSido = '인천';

    // 지도 클릭 → 데이터 추가 시 저장할 Apps Script 웹앱 URL (배포 후 이 값을 교체하세요)
    const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbyvPCqBtOfXojX57Pks7RoWEpKtHeWa7mEuRwIBpq8bIcT2bzQgj9g0txeRfCnG89xv/exec';

    const map = new naver.maps.Map('map', {
      center: new naver.maps.LatLng(37.4563, 126.7052),
      zoom: 11
    });

    naver.maps.Event.addListener(map, 'click', (e) => {
      infoWindows.forEach(iw => iw.close());
      officialInfoWindows.forEach(iw => iw.close());
      openAddDataForm(e.coord);
    });

    naver.maps.Event.addListener(map, 'zoom_changed', () => {
      updateOverlayMode();
    });

    let markers = [];
    let infoWindows = [];
    let markerEntries = [];
    let officialMarkers = [];
    let officialInfoWindows = [];
    let officialEntries = [];
    let gradientOverlays = [];
    let currentData = [];
    let currentOfficialData = [];
    let officialHistoryByStation = new Map();
    let currentMetric = 'pm10';
    let currentDateFilter = 'all';
    let addDataInfoWindow = null;
    const overlayZoomThreshold = 12;

    // 미세먼지 등급 기준(㎍/㎥) - 좋음/보통/나쁨/매우나쁨 (환경부 기준)
    const dustColorStops = {
      pm10: [
        { value: 0, color: [34, 197, 94] },
        { value: 30, color: [34, 197, 94] },
        { value: 80, color: [234, 179, 8] },
        { value: 150, color: [249, 115, 22] },
        { value: 300, color: [239, 68, 68] }
      ],
      pm25: [
        { value: 0, color: [34, 197, 94] },
        { value: 15, color: [34, 197, 94] },
        { value: 35, color: [234, 179, 8] },
        { value: 75, color: [249, 115, 22] },
        { value: 150, color: [239, 68, 68] }
      ]
    };

    const dustTierLabels = {
      pm10: [
        { label: '좋음', range: '0~30' },
        { label: '보통', range: '31~80' },
        { label: '나쁨', range: '81~150' },
        { label: '매우나쁨', range: '151+' }
      ],
      pm25: [
        { label: '좋음', range: '0~15' },
        { label: '보통', range: '16~35' },
        { label: '나쁨', range: '36~75' },
        { label: '매우나쁨', range: '76+' }
      ]
    };

    function escapeHtml(text) {
      return String(text ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // 학생 시트 열: 위도, 경도, 학교명, 측정자이름, 미세먼지(PM10), 초미세먼지(PM2.5)
    // 한 행에는 PM10 또는 PM2.5 중 하나만 값이 채워집니다.
    function getStudentRowMetric(item) {
      const pm10Raw = item['미세먼지(PM10)'];
      const pm25Raw = item['초미세먼지(PM2.5)'];
      const pm10 = Number(pm10Raw);
      const pm25 = Number(pm25Raw);

      if (pm10Raw !== undefined && pm10Raw !== '' && !Number.isNaN(pm10)) {
        return { metric: 'pm10', value: pm10 };
      }
      if (pm25Raw !== undefined && pm25Raw !== '' && !Number.isNaN(pm25)) {
        return { metric: 'pm25', value: pm25 };
      }
      return null;
    }

    // 날짜/시간 문자열에서 날짜(YYYY-MM-DD) 부분만 추출
    function extractDateKey(raw) {
      if (!raw) return null;

      const isoMatch = raw.match(/^\d{4}-\d{2}-\d{2}/);
      if (isoMatch) return isoMatch[0];

      const parsed = new Date(raw);
      if (Number.isNaN(parsed.getTime())) return null;

      const y = parsed.getFullYear();
      const m = String(parsed.getMonth() + 1).padStart(2, '0');
      const d = String(parsed.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getItemDateKey(item) {
      return extractDateKey(item['측정시간']);
    }

    function matchesDateFilter(item) {
      if (currentDateFilter === 'all') return true;
      return getItemDateKey(item) === currentDateFilter;
    }

    function populateDateFilter(data) {
      const select = document.getElementById('dateFilter');

      const studentDateKeys = data.map(getItemDateKey).filter(Boolean);
      const officialDateKeys = [];
      officialHistoryByStation.forEach(records => {
        records.forEach(r => {
          const key = extractDateKey(r.dataTime);
          if (key) officialDateKeys.push(key);
        });
      });

      const dateKeys = Array.from(new Set([...studentDateKeys, ...officialDateKeys])).sort().reverse();

      select.innerHTML = '<option value="all">전체(실시간)</option>' +
        dateKeys.map(key => `<option value="${key}">${key}</option>`).join('');

      if (dateKeys.includes(currentDateFilter)) {
        select.value = currentDateFilter;
      } else {
        currentDateFilter = 'all';
        select.value = 'all';
      }
    }

    function onDateFilterChange(value) {
      currentDateFilter = value;
      renderList(currentData);
      updateMetricNote();
      updateOfficialMarkersDisplay();
      rebuildGradientOverlays();
      updateOverlayMode();
    }

    function getColorByValue(value, metric = currentMetric) {
      const numericValue = Number(value);
      if (Number.isNaN(numericValue)) return 'rgb(148, 163, 184)';

      const stops = dustColorStops[metric];
      if (numericValue <= stops[0].value) return `rgb(${stops[0].color.join(',')})`;

      for (let i = 0; i < stops.length - 1; i++) {
        const a = stops[i];
        const b = stops[i + 1];
        if (numericValue <= b.value) {
          const t = (numericValue - a.value) / (b.value - a.value);
          const rgb = a.color.map((channel, idx) => Math.round(channel + (b.color[idx] - channel) * t));
          return `rgb(${rgb.join(',')})`;
        }
      }

      return `rgb(${stops[stops.length - 1].color.join(',')})`;
    }

    function renderLegend() {
      const legend = document.getElementById('legend');
      const tiers = dustTierLabels[currentMetric];
      const stops = dustColorStops[currentMetric];
      const tierColors = [stops[1].color, stops[2].color, stops[3].color, stops[4].color];

      legend.innerHTML = `
        <div class="legend-title">${currentMetric === 'pm10' ? '미세먼지(PM10)' : '초미세먼지(PM2.5)'} 등급 (㎍/㎥)</div>
        <div class="legend-row">
          ${tiers.map((tier, idx) => `
            <div class="legend-item">
              <span class="legend-swatch" style="background: rgb(${tierColors[idx].join(',')});"></span>
              <span>${tier.label}<br>${tier.range}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function createMarkerIcon(color) {
      return {
        content: `
      <div style="
        width: 22px;
        height: 22px;
        border-radius: 50% 50% 50% 0;
        background: ${color};
        border: 2px solid white;
        box-shadow: 0 2px 8px rgba(0,0,0,0.28);
        transform: rotate(-45deg);
      "></div>
    `,
        anchor: new naver.maps.Point(11, 22)
      };
    }

    function createOfficialMarkerIcon(color) {
      return {
        content: `
      <div style="
        width: 18px;
        height: 18px;
        border-radius: 5px;
        background: ${color};
        border: 2px solid #1e293b;
        box-shadow: 0 2px 8px rgba(0,0,0,0.28);
      "></div>
    `,
        anchor: new naver.maps.Point(9, 9)
      };
    }

    function aggregateNearbyPointsByAverage(points, cellSize = 0.006) {
      const buckets = new Map();

      points.forEach(point => {
        const { lat, lng, value } = point;
        if (Number.isNaN(lat) || Number.isNaN(lng) || Number.isNaN(value)) return;

        const latKey = Math.round(lat / cellSize);
        const lngKey = Math.round(lng / cellSize);
        const key = `${latKey}_${lngKey}`;

        if (!buckets.has(key)) {
          buckets.set(key, { latSum: 0, lngSum: 0, valueSum: 0, count: 0 });
        }

        const bucket = buckets.get(key);
        bucket.latSum += lat;
        bucket.lngSum += lng;
        bucket.valueSum += value;
        bucket.count += 1;
      });

      return Array.from(buckets.values()).map(bucket => ({
        lat: bucket.latSum / bucket.count,
        lng: bucket.lngSum / bucket.count,
        avgValue: bucket.valueSum / bucket.count,
        count: bucket.count
      }));
    }

    function clearGradientOverlays() {
      gradientOverlays.forEach(circle => circle.setMap(null));
      gradientOverlays = [];
    }

    function rebuildGradientOverlays() {
      clearGradientOverlays();

      const studentPoints = currentData
        .map(item => {
          const info = getStudentRowMetric(item);
          if (!info || info.metric !== currentMetric || !matchesDateFilter(item)) return null;
          return {
            lat: Number(item['위도']),
            lng: Number(item['경도']),
            value: info.value
          };
        })
        .filter(Boolean);

      const officialPoints = currentOfficialData.map(station => ({
        lat: station.lat,
        lng: station.lng,
        value: getOfficialValueForDate(station, currentMetric, currentDateFilter)
      }));

      const validPoints = [...studentPoints, ...officialPoints]
        .filter(p => !Number.isNaN(p.lat) && !Number.isNaN(p.lng) && !Number.isNaN(p.value));

      const aggregated = aggregateNearbyPointsByAverage(validPoints, 0.006);
      const ringCount = 10;

      aggregated.forEach(point => {
        const color = getColorByValue(point.avgValue, currentMetric);
        const center = new naver.maps.LatLng(point.lat, point.lng);
        const baseRadius = 550 + Math.min(point.count, 6) * 120;

        for (let i = ringCount; i >= 1; i--) {
          const t = i / ringCount;
          gradientOverlays.push(new naver.maps.Circle({
            map: null,
            center,
            radius: baseRadius * t,
            strokeWeight: 0,
            fillColor: color,
            fillOpacity: 0.32 * Math.pow(1 - t, 1.7)
          }));
        }
      });
    }

    function updateOverlayMode() {
      infoWindows.forEach(iw => iw.close());
      officialInfoWindows.forEach(iw => iw.close());

      const zoom = map.getZoom();
      const showPins = zoom >= overlayZoomThreshold;

      markerEntries.forEach(entry => {
        const visible = showPins && entry.rowMetric === currentMetric && matchesDateFilter(entry.item);
        entry.marker.setMap(visible ? map : null);
      });
      officialMarkers.forEach(marker => marker.setMap(showPins ? map : null));
      gradientOverlays.forEach(circle => circle.setMap(showPins ? null : map));
    }

    function updateMetricNote() {
      const hasStudentDataForMetric = currentData.some(item => {
        const info = getStudentRowMetric(item);
        return info && info.metric === currentMetric && matchesDateFilter(item);
      });

      document.getElementById('metricNote').textContent = hasStudentDataForMetric
        ? ''
        : `※ 현재 ${currentMetric === 'pm10' ? '미세먼지(PM10)' : '초미세먼지(PM2.5)'} 학생 측정 데이터가 없어 공식 측정소 데이터만 표시됩니다.`;
    }

    function setMetric(metric) {
      if (metric === currentMetric) return;
      currentMetric = metric;

      document.querySelectorAll('.metric-toggle').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.metric === metric);
      });

      updateMetricNote();
      renderList(currentData);
      renderLegend();
      updateOfficialMarkersDisplay();
      rebuildGradientOverlays();
      updateOverlayMode();
    }

    function parseCSV(csvText) {
      const rows = [];
      let row = [];
      let value = '';
      let inQuotes = false;

      for (let i = 0; i < csvText.length; i++) {
        const char = csvText[i];
        const next = csvText[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            value += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(value);
          value = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(value);
          if (row.some(cell => String(cell).trim() !== '')) rows.push(row);
          row = [];
          value = '';
        } else {
          value += char;
        }
      }

      if (value.length > 0 || row.length > 0) {
        row.push(value);
        if (row.some(cell => String(cell).trim() !== '')) rows.push(row);
      }

      if (rows.length === 0) return [];
      const headers = rows[0].map(h => h.trim());
      return rows.slice(1).map(cols => {
        const obj = {};
        headers.forEach((header, idx) => {
          obj[header] = (cols[idx] ?? '').trim();
        });
        return obj;
      });
    }

    function clearMap() {
      markers.forEach(marker => marker.setMap(null));
      markers = [];

      infoWindows.forEach(iw => iw.close());
      infoWindows = [];

      markerEntries = [];
    }

    function createInfoHtml(item) {
      const info = getStudentRowMetric(item);
      const label = info && info.metric === 'pm25' ? '초미세먼지(PM2.5)' : '미세먼지(PM10)';
      const value = info ? info.value : '-';

      return `
    <div class="infobox">
      <strong>${escapeHtml(item['학교명'] || '학교명 없음')}</strong><br>
      ${label}: ${escapeHtml(value)}<br>
      측정자: ${escapeHtml(item['측정자이름'])}<br>
      측정시간: ${escapeHtml(item['측정시간'] || '-')}
    </div>
  `;
    }

    function renderList(data) {
      const list = document.getElementById('list');

      const visibleData = data.filter(item => {
        const info = getStudentRowMetric(item);
        return info && info.metric === currentMetric && matchesDateFilter(item);
      });

      if (!visibleData.length) {
        list.innerHTML = '<div class="empty">표시할 데이터가 없습니다.</div>';
        return;
      }

      const metricLabel = currentMetric === 'pm10' ? '미세먼지(PM10)' : '초미세먼지(PM2.5)';

      list.innerHTML = visibleData.map((item, index) => {
        const info = getStudentRowMetric(item);
        const color = getColorByValue(info.value, info.metric);

        return `
      <div class="card" data-index="${index}" style="cursor:pointer;">
        <strong>${escapeHtml(item['학교명'] || '학교명 없음')}</strong>
        <div class="meta">측정자: ${escapeHtml(item['측정자이름'])} · ${escapeHtml(item['측정시간'] || '시간 미기록')}</div>
        <div class="value" style="background:${color}22; color:#111827; border:1px solid ${color}55;">
          <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${color};margin-right:6px;vertical-align:middle;"></span>
          ${metricLabel}: ${info.value}
        </div>
      </div>
    `;
      }).join('');

      const cards = list.querySelectorAll('.card');

      cards.forEach((card, cardIndex) => {
        const item = visibleData[cardIndex];
        const entry = markerEntries.find(e => e.item === item);
        if (!entry) return;

        // PC: 카드에 마우스 올리면 지도 점의 정보창 표시
        card.addEventListener('mouseenter', () => {
          infoWindows.forEach(iw => iw.close());
          entry.infoWindow.open(map, entry.marker);
        });

        // PC: 마우스 치우면 닫기
        card.addEventListener('mouseleave', () => {
          entry.infoWindow.close();
        });

        // 모바일: 카드 터치하면 열기 + 해당 위치로 이동
        card.addEventListener('click', () => {
          infoWindows.forEach(iw => iw.close());
          entry.infoWindow.open(map, entry.marker);
          map.panTo(entry.marker.getPosition());
        });
      });
    }

    function fitAllMarkers() {
      if (!markers.length) return;
      const bounds = new naver.maps.LatLngBounds();
      markers.forEach(marker => bounds.extend(marker.getPosition()));
      map.fitBounds(bounds, { top: 40, right: 40, bottom: 40, left: 40 });
    }

    async function loadData() {
      const status = document.getElementById('status');
      status.textContent = '데이터를 불러오는 중...';

      try {
        const response = await fetch(csvUrl + (csvUrl.includes('?') ? '&' : '?') + 't=' + Date.now());
        if (!response.ok) throw new Error('CSV 불러오기 실패: ' + response.status);

        const csvText = await response.text();
        const rawData = parseCSV(csvText);

        const validData = rawData.filter(item => {
          const lat = Number(item['위도']);
          const lng = Number(item['경도']);
          if (Number.isNaN(lat) || Number.isNaN(lng)) return false;
          return getStudentRowMetric(item) !== null;
        });

        currentData = validData;

        populateDateFilter(validData);

        clearMap();

        validData.forEach(item => {
          const lat = Number(item['위도']);
          const lng = Number(item['경도']);
          const position = new naver.maps.LatLng(lat, lng);

          const info = getStudentRowMetric(item);
          const color = getColorByValue(info.value, info.metric);

          const marker = new naver.maps.Marker({
            position,
            map: null,
            title: item['학교명'] || '측정 지점',
            icon: createMarkerIcon(color)
          });

          const infoWindow = new naver.maps.InfoWindow({
            content: createInfoHtml(item),
            borderWidth: 1,
            backgroundColor: '#fff',
            anchorSize: new naver.maps.Size(12, 14)
          });

          // PC hover 동작
          naver.maps.Event.addListener(marker, 'mouseover', () => {
            infoWindows.forEach(iw => iw.close());
            infoWindow.open(map, marker);
          });

          naver.maps.Event.addListener(marker, 'mouseout', () => {
            infoWindow.close();
          });

          // 모바일 터치 동작
          naver.maps.Event.addListener(marker, 'click', () => {
            infoWindows.forEach(iw => iw.close());
            infoWindow.open(map, marker);
          });

          markers.push(marker);
          infoWindows.push(infoWindow);
          markerEntries.push({ item, rowMetric: info.metric, rowValue: info.value, marker, infoWindow });
        });

        renderList(validData);
        updateMetricNote();
        rebuildGradientOverlays();

        if (validData.length) fitAllMarkers();
        updateOverlayMode();

        status.textContent = `총 ${validData.length}개의 측정 지점을 표시했습니다. 마지막 수동 새로고침: ${new Date().toLocaleString('ko-KR')}`;
      } catch (error) {
        console.error(error);
        status.textContent = '오류: ' + error.message;
        document.getElementById('list').innerHTML = '<div class="empty">데이터를 읽지 못했습니다.</div>';
      }
    }

    // ── 공공데이터포털(에어코리아) 실시간 측정소 연동 ──
    function createOfficialInfoHtml(station, value, dateKey) {
      const label = currentMetric === 'pm10' ? '미세먼지(PM10)' : '초미세먼지(PM2.5)';
      const dateLabel = dateKey === 'all' ? '실시간' : `${dateKey} 일평균`;
      const valueLabel = Number.isNaN(value) ? '자료 없음' : `${value.toFixed(1)} ㎍/㎥`;

      return `
    <div class="infobox">
      <strong>${escapeHtml(station.stationName)} (공식 측정소)</strong><br>
      ${label}: ${valueLabel}<br>
      기준: ${escapeHtml(dateLabel)}
    </div>
  `;
    }

    // 특정 날짜의 측정소 값 계산 (all이면 실시간 값, 아니면 해당 날짜 시간별 기록의 평균)
    function getOfficialValueForDate(station, metric, dateKey) {
      if (dateKey === 'all') {
        return metric === 'pm10' ? station.pm10Value : Number(station.pm25Value);
      }

      const records = officialHistoryByStation.get(station.stationName) || [];
      const key = metric === 'pm10' ? 'pm10Value' : 'pm25Value';

      const values = records
        .filter(r => extractDateKey(r.dataTime) === dateKey)
        .map(r => Number(r[key]))
        .filter(v => !Number.isNaN(v));

      if (!values.length) return NaN;
      return values.reduce((sum, v) => sum + v, 0) / values.length;
    }

    function updateOfficialMarkersDisplay() {
      officialEntries.forEach(entry => {
        const value = getOfficialValueForDate(entry.station, currentMetric, currentDateFilter);
        entry.marker.setIcon(createOfficialMarkerIcon(getColorByValue(value, currentMetric)));
        entry.infoWindow.setContent(createOfficialInfoHtml(entry.station, value, currentDateFilter));
      });
    }

    function clearOfficialMarkers() {
      officialMarkers.forEach(marker => marker.setMap(null));
      officialMarkers = [];

      officialInfoWindows.forEach(iw => iw.close());
      officialInfoWindows = [];

      officialEntries = [];
    }

    async function fetchAirKoreaItems(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error('공공데이터 API 요청 실패: ' + response.status);

      const json = await response.json();
      const header = json?.response?.header;
      if (header && header.resultCode !== '00') {
        throw new Error(header.resultMsg || '공공데이터 API 오류');
      }

      return json?.response?.body?.items ?? [];
    }

    // 측정소 1곳의 최근 1개월 시간별 이력 조회 (날짜별 평균 계산용)
    async function fetchStationHistory(stationName) {
      const url = `${airKoreaBase}/getMsrstnAcctoRltmMesureDnsty?serviceKey=${encodeURIComponent(airKoreaServiceKey)}&returnType=json&numOfRows=999&pageNo=1&stationName=${encodeURIComponent(stationName)}&dataTerm=MONTH&ver=1.3`;

      try {
        return await fetchAirKoreaItems(url);
      } catch (error) {
        console.error('측정소 이력 조회 실패:', stationName, error);
        return [];
      }
    }

    async function loadAirKoreaData() {
      const officialStatus = document.getElementById('officialStatus');
      officialStatus.textContent = '공식 측정소 데이터를 불러오는 중...';

      try {
        const stationListUrl = `${msrstnBase}/getMsrstnList?serviceKey=${encodeURIComponent(airKoreaServiceKey)}&returnType=json&numOfRows=100&pageNo=1&addr=${encodeURIComponent(targetSido)}`;
        const realtimeUrl = `${airKoreaBase}/getCtprvnRltmMesureDnsty?serviceKey=${encodeURIComponent(airKoreaServiceKey)}&returnType=json&numOfRows=100&pageNo=1&sidoName=${encodeURIComponent(targetSido)}&ver=1.3`;

        const [stations, readings] = await Promise.all([
          fetchAirKoreaItems(stationListUrl),
          fetchAirKoreaItems(realtimeUrl)
        ]);

        const stationCoords = new Map();
        stations.forEach(station => {
          const lat = Number(station.dmX);
          const lng = Number(station.dmY);
          if (Number.isNaN(lat) || Number.isNaN(lng)) return;
          stationCoords.set(station.stationName, { lat, lng });
        });

        const officialData = readings
          .map(item => {
            const coords = stationCoords.get(item.stationName);
            const pm10Value = Number(item.pm10Value);
            if (!coords || Number.isNaN(pm10Value)) return null;

            return {
              stationName: item.stationName,
              lat: coords.lat,
              lng: coords.lng,
              pm10Value,
              pm25Value: item.pm25Value,
              dataTime: item.dataTime
            };
          })
          .filter(Boolean);

        currentOfficialData = officialData;

        clearOfficialMarkers();

        officialData.forEach(station => {
          const value = getOfficialValueForDate(station, currentMetric, currentDateFilter);
          const color = getColorByValue(value, currentMetric);

          const marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(station.lat, station.lng),
            map: null,
            title: station.stationName + ' (공식 측정소)',
            icon: createOfficialMarkerIcon(color),
            zIndex: 50
          });

          const infoWindow = new naver.maps.InfoWindow({
            content: createOfficialInfoHtml(station, value, currentDateFilter),
            borderWidth: 1,
            backgroundColor: '#fff',
            anchorSize: new naver.maps.Size(12, 14)
          });

          naver.maps.Event.addListener(marker, 'mouseover', () => {
            infoWindows.forEach(iw => iw.close());
            officialInfoWindows.forEach(iw => iw.close());
            infoWindow.open(map, marker);
          });

          naver.maps.Event.addListener(marker, 'mouseout', () => {
            infoWindow.close();
          });

          naver.maps.Event.addListener(marker, 'click', () => {
            infoWindows.forEach(iw => iw.close());
            officialInfoWindows.forEach(iw => iw.close());
            infoWindow.open(map, marker);
          });

          officialMarkers.push(marker);
          officialInfoWindows.push(infoWindow);
          officialEntries.push({ station, marker, infoWindow });
        });

        rebuildGradientOverlays();
        updateOverlayMode();

        officialStatus.textContent = `공식 측정소 ${officialData.length}곳 표시 중 · 지난 1개월 이력 불러오는 중...`;

        const historyResults = await Promise.all(
          officialData.map(station => fetchStationHistory(station.stationName))
        );

        officialHistoryByStation = new Map();
        officialData.forEach((station, idx) => {
          officialHistoryByStation.set(station.stationName, historyResults[idx]);
        });

        populateDateFilter(currentData);
        updateOfficialMarkersDisplay();
        rebuildGradientOverlays();

        officialStatus.textContent = `공식 측정소 ${officialData.length}곳 · 최근 1개월 이력 포함 (${new Date().toLocaleString('ko-KR')})`;
      } catch (error) {
        console.error(error);
        officialStatus.textContent = '공식 측정소 데이터를 불러오지 못했습니다: ' + error.message;
      }
    }

    // ── 지도 클릭으로 새 측정값 추가 ──
    function createAddDataForm(latlng) {
      const wrapper = document.createElement('div');
      wrapper.className = 'add-form';
      let formMetric = currentMetric;

      wrapper.innerHTML = `
        <div class="add-form-header">📍 이 위치에 측정값 추가</div>
        <div class="add-form-coords">위도 ${latlng.lat().toFixed(5)} · 경도 ${latlng.lng().toFixed(5)}</div>

        <label>학교명</label>
        <input type="text" class="f-school" placeholder="예: OO초등학교">

        <label>측정자 이름</label>
        <input type="text" class="f-name" placeholder="이름을 입력하세요">

        <label>측정 항목</label>
        <div class="add-form-metric">
          <button type="button" class="add-metric-btn" data-metric="pm10">미세먼지<br><small>PM10</small></button>
          <button type="button" class="add-metric-btn" data-metric="pm25">초미세먼지<br><small>PM2.5</small></button>
        </div>

        <label>측정값 (㎍/㎥)</label>
        <input type="number" class="f-dust" placeholder="숫자만 입력">

        <div class="add-form-actions">
          <button type="button" class="add-form-submit">저장하기</button>
          <button type="button" class="add-form-cancel">취소</button>
        </div>
        <div class="add-form-status"></div>
      `;

      const metricBtns = wrapper.querySelectorAll('.add-metric-btn');
      const syncMetricButtons = () => {
        metricBtns.forEach(btn => btn.classList.toggle('active', btn.dataset.metric === formMetric));
      };
      syncMetricButtons();

      metricBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          formMetric = btn.dataset.metric;
          syncMetricButtons();
        });
      });

      const statusEl = wrapper.querySelector('.add-form-status');
      const submitBtn = wrapper.querySelector('.add-form-submit');

      wrapper.querySelector('.add-form-cancel').addEventListener('click', () => {
        addDataInfoWindow.close();
      });

      submitBtn.addEventListener('click', async () => {
        const school = wrapper.querySelector('.f-school').value.trim();
        const name = wrapper.querySelector('.f-name').value.trim();
        const dust = wrapper.querySelector('.f-dust').value.trim();

        if (!school || !name || !dust || Number.isNaN(Number(dust))) {
          statusEl.textContent = '학교명, 측정자 이름, 측정값을 모두 입력해주세요.';
          return;
        }

        if (appsScriptUrl.includes('PASTE_YOUR_APPS_SCRIPT_WEB_APP_URL_HERE')) {
          statusEl.textContent = '아직 저장 기능(Apps Script)이 연결되지 않았습니다.';
          return;
        }

        submitBtn.disabled = true;
        statusEl.textContent = '저장 중...';

        try {
          const response = await fetch(appsScriptUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              '위도': latlng.lat(),
              '경도': latlng.lng(),
              '학교명': school,
              '측정자이름': name,
              '미세먼지(PM10)': formMetric === 'pm10' ? dust : '',
              '초미세먼지(PM2.5)': formMetric === 'pm25' ? dust : ''
            })
          });

          if (!response.ok) throw new Error('저장 요청 실패: ' + response.status);

          statusEl.textContent = '저장되었습니다! 잠시 후 지도에 반영됩니다.';
          setTimeout(() => {
            addDataInfoWindow.close();
            refreshAll();
          }, 1200);
        } catch (error) {
          console.error(error);
          statusEl.textContent = '저장 실패: ' + error.message;
          submitBtn.disabled = false;
        }
      });

      return wrapper;
    }

    function openAddDataForm(latlng) {
      if (!addDataInfoWindow) {
        addDataInfoWindow = new naver.maps.InfoWindow({
          content: document.createElement('div'),
          borderWidth: 1,
          backgroundColor: '#fff',
          anchorSize: new naver.maps.Size(12, 14)
        });
      }

      addDataInfoWindow.setContent(createAddDataForm(latlng));
      addDataInfoWindow.open(map, latlng);
    }

    async function refreshAll() {
      await loadData();
      await loadAirKoreaData();
    }

    renderLegend();
    refreshAll();
  </script>
</body>
